# Build and test on every system AmberEdit is meant to build on.
#
# The Linux jobs run their distribution in `docker run` from an ordinary
# ubuntu-latest or ubuntu-24.04-arm runner rather than through the `container:`
# key. That is deliberate: `container:` makes every action run its own Node
# inside the image, and RHEL 8's glibc sits exactly on the boundary of what
# current Node builds accept. Checking out on the host and mounting the tree in sidesteps the
# question entirely, and it is the same command AGENTS.md gives for checking the
# compiler floor by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Two axes, so that every distribution is walked on both architectures
        # and each one's packages are written once. The per-distribution keys
        # arrive through `include`: an entry naming a `distro` merges into both
        # combinations of that distro rather than becoming a job of its own, so
        # adding a distribution below adds it to both architectures.
        #
        # aarch64 is not a rerun of the same question. Plain `char` is signed on
        # x86_64 and unsigned there, and the byte-at-a-time work in the charset
        # tables is where that lands; the images are the distributions' own
        # aarch64 builds, so what the second half of this matrix also says is
        # that every one of these repositories carries the same packages for it.
        arch: [x86_64, arm64]
        distro: [rocky8, rocky9, rocky10, fedora, arch, debian12, debian-stable, ubuntu2204, ubuntu2404, ubuntu2604]
        # Arch is the one distribution with no aarch64 job to run: the official
        # `archlinux` image is published for amd64 only — Arch Linux ARM is a
        # separate distribution, not a second architecture of this one — and
        # `PKGBUILD` says arch=('x86_64').
        exclude:
          - arch: arm64
            distro: arch
        include:
          # The floor, and the whole reason the project is C++17: stock GCC 8.5
          # and the CMake the release ships, no gcc-toolset. It is also the
          # reason the tests are on doctest: EPEL 8 has no Catch2 v3 at all.
          # EPEL supplies expected-devel here too, and Fedora carries its own.
          - distro: rocky8
            name: Rocky Linux 8 (GCC 8, the floor)
            image: rockylinux:8
            deps: dnf -y install epel-release && dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel expected-devel doctest-devel gettext
          - distro: rocky9
            name: Rocky Linux 9
            image: rockylinux:9
            deps: dnf -y install epel-release && dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel expected-devel doctest-devel gettext glibc-gconv-extra
          # Two things are not typos. The image is `rockylinux/rockylinux`, not
          # the `rockylinux` the two above are: the Docker Official image stops
          # at 9 and Rocky publishes 10 itself. And zlib on RHEL 10 is zlib-ng
          # wearing the old name — `zlib-devel` does not exist there, and
          # `zlib-ng-compat-devel` is what carries zlib.h and zlib.pc.
          - distro: rocky10
            name: Rocky Linux 10
            image: rockylinux/rockylinux:10
            deps: dnf -y install epel-release && dnf -y install gcc-c++ cmake make ncurses-devel zlib-ng-compat-devel expected-devel doctest-devel gettext glibc-gconv-extra
          # The newest GCC any point release carries, which is where a warning or
          # a tightened header shows up years before it reaches an LTS.
          - distro: fedora
            name: Fedora latest (newest GCC)
            image: fedora:latest
            deps: dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel expected-devel doctest-devel gettext glibc-gconv-extra
          # Rolling, so normally ahead of even Fedora: the ceiling of this matrix
          # against Rocky 8's floor. `-Syu` rather than `-S` because partial
          # upgrades are unsupported on Arch and the base image lags the mirrors.
          # base-devel is not asked for — it drags in fakeroot, sudo and patch,
          # which this job has no use for — so the four tools are named instead.
          - distro: arch
            name: Arch Linux (rolling)
            image: archlinux:latest
            deps: pacman -Syu --noconfirm --needed gcc cmake make pkgconf ncurses zlib tl-expected doctest gettext
          # Oldstable, and the only job in this matrix built without pkg-config.
          # Both halves of that are deliberate. `debian:stable` is trixie now,
          # so nothing else here covers bookworm's GCC 12 and CMake 3.25 — the
          # deb built for it in release.yml is built from the same two. And
          # every other Linux job installs pkg-config, which sends the curses
          # lookup to PkgConfig::NCURSESW and leaves the find_package(Curses)
          # branch beside it — what a machine without pkg-config takes — with no
          # coverage at all. macOS does not stand in for it either: CMake feeds
          # CMAKE_PREFIX_PATH to pkg-config, so Homebrew's ncursesw.pc is found
          # there and that job takes the same branch the Linux ones do.
          - distro: debian12
            name: Debian 12 (oldstable, no pkg-config)
            image: debian:12
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make libncurses-dev zlib1g-dev libexpected-dev doctest-dev gettext
          # doctest-dev is one name across all five of these, and across the
          # three RHEL rebuilds above under doctest-devel.
          - distro: debian-stable
            name: Debian stable
            image: debian:stable
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev libexpected-dev doctest-dev gettext
          - distro: ubuntu2204
            name: Ubuntu 22.04
            image: ubuntu:22.04
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev libexpected-dev doctest-dev gettext
          - distro: ubuntu2404
            name: Ubuntu 24.04
            image: ubuntu:24.04
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev libexpected-dev doctest-dev gettext
          # The first target carrying CMake 4, which refuses the compatibility of
          # anything older than 3.5. The floor is 3.16 and so is accepted, but
          # this is the job that says so.
          - distro: ubuntu2604
            name: Ubuntu 26.04
            image: ubuntu:26.04
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev libexpected-dev doctest-dev gettext
    steps:
      - uses: actions/checkout@v4

      # The copy is not incidental: one test opens testdata/msgbase/charsets in
      # the source tree itself, so a read-only mount fails there and nowhere
      # else.
      - name: Build and test
        env:
          DEPS: ${{ matrix.deps }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src:ro -e DEPS -e DEBIAN_FRONTEND=noninteractive "$IMAGE" sh -c '
            set -eu
            eval "$DEPS"
            cp -a /src /work && rm -rf /work/build
            cmake -S /work -B /out -DCMAKE_BUILD_TYPE=Release
            cmake --build /out -j"$(nproc)"
            cd /out && ctest --output-on-failure'

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: macOS x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # Apple ships ncurses 5.7, which has no wide characters at all, so the
      # Homebrew one is asked for by prefix. This pair of jobs is also the only
      # coverage the two CMake branches that are dead on glibc get: iconv as a
      # separate library, and the header under ncursesw/.
      - name: Install ncurses, tl-expected, doctest and gettext
        run: brew install ncurses tl-expected doctest gettext

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix ncurses);$(brew --prefix tl-expected);$(brew --prefix doctest);$(brew --prefix gettext)"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Two entries written out, rather than the pair of axes the Linux job
        # has: these environments differ in more than a prefix. UCRT64 is x86_64
        # and built with GCC; the aarch64 environment MSYS2 publishes is
        # CLANGARM64 and built with clang, there being no GCC for aarch64 in it.
        #
        # What both of them are, and MINGW64 is not, is UCRT. The two differ in
        # which C runtime they link, and that is not a detail: MINGW64 builds
        # against the msvcrt.dll that has been in Windows since the nineties,
        # whose strftime has no `%n` and answers a format holding one with
        # nothing at all. UCRT is what Windows 10 and later ship and what a
        # cross-build from Linux or macOS links, so this is the runtime the
        # binary users get is tested against — on both architectures.
        #
        # llvm-objdump is named in the second list. The import check below needs
        # an objdump, CLANGARM64 has no binutils, and a missing one makes that
        # step exit 2 rather than quietly pass.
        include:
          - name: Windows x86_64 (MSYS2/UCRT64)
            runner: windows-latest
            msystem: UCRT64
            packages: >-
              git
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-zlib
              mingw-w64-ucrt-x86_64-libiconv
              mingw-w64-ucrt-x86_64-gettext
              mingw-w64-ucrt-x86_64-tl-expected
              mingw-w64-ucrt-x86_64-doctest
              mingw-w64-ucrt-x86_64-pdcurses
          - name: Windows arm64 (MSYS2/CLANGARM64)
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: >-
              git
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-llvm
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-zlib
              mingw-w64-clang-aarch64-libiconv
              mingw-w64-clang-aarch64-gettext
              mingw-w64-clang-aarch64-tl-expected
              mingw-w64-clang-aarch64-doctest
              mingw-w64-clang-aarch64-pdcurses
    # MSYS2's shell for every step, so that the paths CMake is handed and the
    # paths the compiler resolves are the same paths.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # pacman, the same way the Linux jobs use dnf and apt: every dependency is
      # a package, and none of them is fetched by the build.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The same check the release job runs, here as well as there so that a
      # dependency that stops being linked statically is a failed push rather
      # than a broken zip. These jobs build the way the release does — the link
      # is static because AMBEREDIT_STATIC defaults on for Windows, and it covers
      # clang as well as GCC — so the two are asking the same question of the
      # same binary.
      - name: Check what the .exe needs
        run: tools/check-w64-imports.sh build/bin/amberedit.exe

      # The whole suite runs here, which is the reason these jobs build on
      # Windows rather than cross-building for it: a binary cross-built on Linux
      # is a binary nothing on the build host can run.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # FreeBSD, which GitHub has no runner for: this is an ubuntu runner with
  # FreeBSD in a VM on it, and everything under `run:` below executes inside
  # that VM, against the checkout the action syncs into it.
  #
  # Both branches FreeBSD supports at a time, because what this job is mostly
  # asking is that the packages named below exist and carry what CMake looks
  # for, and that is a question per branch.
  #
  # One architecture, which is the one exclusion here that is not a choice:
  # there is no FreeBSD host anywhere on Actions, so the guest is emulated on a
  # Linux one, and an aarch64 guest has no KVM under it — it runs on TCG, which
  # is slower than this build is worth. What a second architecture would answer,
  # plain `char` being unsigned there, the Linux and Windows arm64 jobs answer.
  freebsd:
    name: FreeBSD ${{ matrix.release }} (x86_64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["15.1", "14.5"]
    steps:
      - uses: actions/checkout@v4

      # `pkgconf` is not optional here, unlike pkg-config on the Linux jobs:
      # without it CMake falls back on its own FindCurses, which in the
      # wide-character mode this build asks for accepts only a header under
      # `ncursesw/` — and FreeBSD's base ncurses is wide and installs it as
      # plain `<curses.h>`, so the fallback fails on a system that has
      # everything. Otherwise the base system is what supplies clang, ncursesw
      # and zlib.
      #
      # `libiconv` is the one package here that AmberEdit does not need and the
      # job installs on purpose. It is on most FreeBSD machines, pulled in by
      # half the ports tree, and it is the configuration that catches a wrong
      # answer about iconv: its header renames every entry point, so a build
      # that decided iconv was in libc and linked nothing fails at link rather
      # than at configure. Covered deliberately and not left to whatever the
      # runner image happens to carry.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y cmake gettext doctest expected pkgconf libiconv
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(sysctl -n hw.ncpu)"
            ctest --test-dir build --output-on-failure
