# Build and test on every system AmberEdit is meant to build on.
#
# The Linux jobs run their distribution in `docker run` from an ordinary
# ubuntu-latest runner rather than through the `container:` key. That is
# deliberate: `container:` makes every action run its own Node inside the image,
# and RHEL 8's glibc sits exactly on the boundary of what current Node builds
# accept. Checking out on the host and mounting the tree in sidesteps the
# question entirely, and it is the same command AGENTS.md gives for checking the
# compiler floor by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, and the whole reason the project is C++17: stock GCC 8.5
          # and the CMake the release ships, no gcc-toolset. It is also the
          # reason the tests are on doctest: EPEL 8 has no Catch2 v3 at all.
          - name: Rocky Linux 8 (GCC 8, the floor)
            image: rockylinux:8
            deps: dnf -y install epel-release && dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel doctest-devel
          - name: Rocky Linux 9
            image: rockylinux:9
            deps: dnf -y install epel-release && dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel doctest-devel glibc-gconv-extra
          # Newest GCC, which is where a warning or a tightened header shows up
          # years before it reaches an LTS.
          - name: Fedora latest (newest GCC)
            image: fedora:latest
            deps: dnf -y install gcc-c++ cmake make ncurses-devel zlib-devel doctest-devel glibc-gconv-extra
          # doctest-dev is one name across all three of these, and across the
          # two RHEL rebuilds above under doctest-devel.
          - name: Debian stable
            image: debian:stable
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev doctest-dev
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev doctest-dev
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            deps: apt-get update && apt-get -y install --no-install-recommends g++ cmake make pkg-config libncurses-dev zlib1g-dev doctest-dev
    steps:
      - uses: actions/checkout@v4

      # The copy is not incidental: one test opens testdata/msgbase/charsets in
      # the source tree itself, so a read-only mount fails there and nowhere
      # else.
      - name: Build and test
        env:
          DEPS: ${{ matrix.deps }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src:ro -e DEPS -e DEBIAN_FRONTEND=noninteractive "$IMAGE" sh -c '
            set -eu
            eval "$DEPS"
            cp -a /src /work && rm -rf /work/build
            cmake -S /work -B /out -DCMAKE_BUILD_TYPE=Release
            cmake --build /out -j"$(nproc)"
            cd /out && ctest --output-on-failure'

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: macOS x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # Apple ships ncurses 5.7, which has no wide characters at all, so the
      # Homebrew one is asked for by prefix. This pair of jobs is also the only
      # coverage the two CMake branches that are dead on glibc get: iconv as a
      # separate library, and the header under ncursesw/.
      - name: Install ncurses and doctest
        run: brew install ncurses doctest

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix ncurses);$(brew --prefix doctest)"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
