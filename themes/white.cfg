# White — paper: a white screen with near-black on it, for a terminal that is
# light to begin with, and a navy window standing on that paper. Name it on the
# config's "theme" line to draw with it.
#
# The comments say what each role paints; themes/black.cfg is the built-in
# palette written out and explains the numbering. Every key is optional, and one
# left out keeps its built-in color — but a light theme cannot leave any out:
# what it does not name it gets from a palette meant for a black screen, which
# on this one would be a pale color on pale paper.
#
# Nothing here is an entry below 16. Those sixteen are whatever the terminal was
# configured to draw them as, and a theme written in them changes with the
# profile it is looked at through; every color below is one the 256-color palette
# fixes. The greys read the other way round from the dark themes: the low
# numbers of the ramp are the ink here and the high ones the paper. A dialog is
# the one thing that reads the other way round again — dark, with light on it.

# Painted across the whole screen: the paper everything else is drawn on, and the
# ground every color below was chosen against. The greys of a field and of the
# scrollbar are steps down from here.
background     231

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. A pale
# blue wash with navy on it: on paper the row being acted on is marked the way a
# highlighter marks a line, by lifting the color of the paper rather than by
# turning the row over into a dark bar.
selection      26
selection_text 231

# Behind a field that is typed into but is not the one being typed into now —
# the header of a message being written — and what is written on that fill. One
# step below the paper, with the message's own ink on it: the slot is cut into
# the page rather than laid on top of it.
input_field    253
input_text     236

# The field the typing is actually in, and the text on it — the same wash the
# lists mark a row with, so that whatever is being acted on wears one color
# everywhere. The attributes button beside the fields takes these too.
focused_field  153
focused_text   17

# The underscores standing in the columns of a field nothing has been typed into
# yet — the room it still has, said the way a paper form says it. A grey that
# sits close to both fills above: they are the ruling of the form, and ruling is
# meant to be felt rather than read.
input_filler   246

# Drawn, in this theme: a field is a step off the paper and no more, and the
# underscores are what says one is there before anything is in it.
input_filler_show on

# A modal box has a palette of its own, the nine keys here — and this is the
# theme that shows why it has to: a box on paper cannot be brighter than the page
# it covers, so it goes the other way and turns dark. Every color in it is chosen
# against navy where every color on the screen is chosen against white, and no
# single role could serve both.
#
# Behind the box, from its frame to the far corner. Navy: dark enough that a
# window is never taken for a part of the page, and blue rather than black
# because a black rectangle on white paper reads as a hole cut in it.
dialog_background 235

# What the box says, and every cell it puts no color of its own on. White — the
# paper's own color, on the one fill in the theme that is dark enough to take it.
dialog_text    231

# The label in the top rule. Pale amber — the one warm color in a window that is
# otherwise blue and white, so the line naming what the box is for is read as a
# name and not as a row of it; the rule either side of it stays the frame's.
dialog_title   255

# A label inside the box, against the value it names. Pale blue: a label is blue
# wherever it is drawn, and in the window the blues run the other way — the
# lighter the shade, the more it stands out.
dialog_label   153

# Its quiet things: the keys along the bottom rule, an area it will not open, a
# menu button whose command is not available, and the underscores in a field the
# box is waiting to be typed into. A blue-grey: a step under the labels and well
# under the text, and still legible on the lighter blue of the slot below.
dialog_hint    110

# Behind a field in the box that is not being typed into now. A lighter blue: the
# window is dark, so the slot in it is cut upwards, the way the screen's own slot
# is cut downwards from the paper.
dialog_field   25

# What a button in the box says while a click on it is being shown.
dialog_flash   231

# The frame round the box — its sides, the rules closing it top and bottom, and
# the dividers between its blocks. A light blue on the navy: the edge of the
# window is what the eye finds first, and a darker line would be lost against the
# fill it is drawn on. Only the labels standing in the rules are lit.
dialog_border  244

# The shadow the box casts on the paper behind it — two columns to the right of
# it and one row below. A light grey rather than a black: on paper a shadow is
# what falls across the page, not a hole in it, and a dark band beside a navy
# window would read as part of the window.
dialog_shadow  250

# The reader's header block: the From/To/Subj labels and their values. Full ink,
# a step over the message under it: who a message is from and what it is about is
# read before the message is, and on paper that is said with weight rather than
# with a color.
header         232

# The top line of every screen — the lists' column headings and the title over a
# message being read. Blue, the theme's own: the line naming what is below is
# not a row of what is below, and a color says so where the whole screen is ink
# on white; a box's own top line is "dialog_title" above.
table_header   25

# The buttons of the context menu. They stand inside a box, so this is a color on
# "dialog_background" and not on the screen: near-white on the navy window, a
# shade under its text and well clear of the "dialog_hint" a button that cannot
# be pressed is drawn in.
menu_button    255

# A From or To naming you — the `name` from the AmberEdit config. Navy: darker
# than the message text rather than lighter, which is how a light screen makes
# something stand out, and clear of the green a row nobody has read wears.
own_name       25

# A message in the message list nobody has read yet, across the row. Dark green
# — on paper a color has to be dark to be read, and this one is far enough from
# the blue of the header and the red of an unsent message to be told from either
# at a glance. A From or To naming you keeps "own_name" above; the rest of the
# row still says the message is unread.
msglist_unread 22

# The message text, and a link inside it. Only the address takes the link color;
# the rest of the line keeps whatever it had.
text           233
link           26

# Quoted text by nesting depth, alternating so that several rounds of reply stay
# apart. Two blues, and both a good deal lighter than the ink the message itself
# is written in: quoted text is somebody else's, and the eye should be able to
# skip it. The deeper one is the first level, which is what is on the screen most
# of the time; the second turns toward violet, so that two rounds of reply are
# told apart by hue and not only by weight.
quote_odd      24
quote_even     26

# Service text, quiet by design:
#   kludge  ^A control lines in the message body (k shows them)
#   screen_buttons
#           the quiet buttons drawn on the screen itself: the back button in the
#           top-left corner, the menu button in the top-right one, and the
#           delete-line button beside the row the cursor is on in the editor
#   dimmed  what is on the screen but is not the user's own: an area the area
#           list cannot open, a menu button whose command is not available on
#           the message in front of you, and the stand-in
#           arealist_description_default puts where an area describes itself
#           with nothing
#
# The buttons and the dimmed things carry more ink than a kludge line: they are
# there to be pointed at, where a kludge line is there to be read past.
kludge         245
screen_buttons 242
dimmed         242

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. Mid grey: the row is there to
# be read past. What is left of the row beside the hints is a rule, drawn in
# "separator" like every other rule.
hint_bar       244

# The tearline and origin closing a message. Darker than the service text above
# and lighter than the message: what closes a message is part of it, and is not
# what anyone reads it for.
trailer        240

# Drawn rather than written: the rules a screen sets its blocks apart with, and
# the scrollbar — the track it runs in and the moving thumb, which carries
# enough ink to be found in the track without being read as text. A box's own
# frame is "dialog_border" above.
separator      248
scroll_track   248
scroll_thumb   240

# Something to see to rather than to read:
#   error    a screen that could not be drawn — a base that cannot be read
#            while the user is looking at it
#   unsent   a message written here that has not gone out yet, across the
#            From/To/Subject of its row in the message list
#
# The unsent row is the softer of the two: it is a state the user put the message
# in, not something that went wrong.
error          210
unsent         167

# Behind every occurrence of what the reader was told to find. A fill, with the
# theme's own "background" written on it — which is why it is dark where the
# rest of the theme is light: the paper color has to be legible on it.
found          90

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. Red, the loudest thing a light screen
# has: it is on screen for a tenth of a second and has to be seen in that time,
# and white — what the dark themes use here — is the paper itself.
animated_button_text 160
