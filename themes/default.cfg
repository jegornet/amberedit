# The palette AmberEdit uses when no theme is named in its config, written out in
# full — copy it and edit. Every key is optional, and one left out keeps its
# built-in color, so a theme of your own may be a single line.
#
# The comments say what each role paints. Several roles share a color here;
# they are separate keys precisely so that a theme can take them apart.
#
# Every value is a number from 0 to 255 — an entry in the terminal's own
# 256-color palette, the same numbering `ESC[38;5;Nm` uses:
#
#     0-7     the ANSI colors, as your terminal draws them
#     8-15    their bright halves
#     16-231  a 6x6x6 cube: 16 + 36*r + 6*g + b, each of r, g and b being 0-5
#     232-255 a ramp of 24 greys, black to white

# Painted across the whole screen rather than left to show through: the colors
# below were chosen against it, and on a light terminal the quiet greys would
# be unreadable.
background     17

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. The
# text is its own role rather than the background reused: a theme whose
# background is black needs something lighter here.
selection      25
selection_text 253

# Behind a field that is typed into — the header of a message being written.
# One step off the background is all it takes to read as a box that accepts
# typing; the field the typing is actually in takes "selection" above instead.
input_field    18

# A modal box has a palette of its own, the seven keys here: it carries a fill of
# its own rather than the screen's, so what is legible on the screen need not be
# legible on it. A theme whose boxes are lighter than its screens — a grey DOS
# window over a black one — turns on being able to say both.
#
# Behind the box, from its frame to the far corner. A step off "background"
# above rather than the background again: a dialog is meant to read as something
# laid over the screen, and this is what says so.
dialog_background 233
# What the box says, and every cell it puts no color of its own on.
dialog_text    253
# The label in its top rule, naming what the box is for.
dialog_title   144
# A label inside it, against the value it names: the From/To/Subj of a message
# being answered, the fields of the import and export dialogs.
dialog_label   75
# Its quiet things: the keys along the bottom rule, an area it will not open, a
# menu button whose command is not available on the message in front of you.
dialog_hint    102
# Behind a field inside the box that is typed into but not being typed into now.
# "dialog_label" above is what stands in it; the field the typing is in takes
# "selection" as everything else that has it does.
dialog_field   18
# What a button in the box says while a click on it is being shown. It has to be
# seen on the fill above and on "selection" alike: a click lands as readily on
# the selected button as on the other one.
dialog_flash   231

# The reader's header block: the From/To/Subj labels and their values.
header         75

# A From or To naming you — the `name` from the AmberEdit config — in the
# header block and in the message list alike.
own_name        253
#own_name       73

# A message in the message list nobody has read yet, across the row — the
# number and the date as well as From, To and Subject. A From or To naming you
# keeps "own_name" above: that cell is about the name in it rather than about
# the message, and the rest of the row still says the message is unread.
#
# The list is the only place it shows: the reader is where a message is read.
# What counts as unread is the mark the base itself keeps — JAM's TimesRead,
# Squish's MSGSEEN — and "highlight_unread off" in the AmberEdit config turns
# the whole thing off.
msglist_unread 73

# The message text, and a link inside it. Only the address itself takes the
# link color; the rest of the line keeps whatever it had, so a link in a quote
# stays in the quote.
text           253
link           75

# Quoted text by nesting depth, alternating so that several rounds of reply
# stay apart.
quote_even     178
quote_odd      186

# Service text, quiet by design:
#   kludge       ^A control lines in the message body (k shows them)
#   footer       the back button in the top-left corner and the menu button in
#                the top-right one
#   dimmed       what is on the screen but is not the user's own: an area the
#                area list cannot open, a menu button whose command is not
#                available on the message in front of you, and the stand-in
#                arealist_description_default puts where an area describes itself
#                with nothing
#   scroll_thumb the moving part of the reader's scrollbar
kludge         102
footer         102
dimmed         102
scroll_thumb   102

# Quiet but a step brighter:
#   trailer        the tearline and origin closing a message
#   table_header   the top line of every screen — the lists' column headings and
#                  the title over a message being read
#   menu_button    the buttons of the context menu, which frame it the same way.
#                  Keep it clear of "dimmed" above, which is what a button that
#                  cannot be pressed is drawn in — one color for both would
#                  leave the two telling nothing apart
trailer        144
table_header   144
menu_button    144

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. Dark grey in both themes: the
# row is there to be read past. What is left of the row beside the hints is a
# rule, drawn in "separator" like every other rule.
hint_bar       8

# Drawn rather than written: the rules between blocks, and the track the
# scrollbar's thumb runs in.
separator      239
scroll_track   239

# Something to see to rather than to read:
#   error        a screen that could not be drawn — a base that cannot be read
#                while the user is looking at it
#   unsent       a message written here that has not gone out yet, across the
#                From/To/Subject of its row in the message list
error          174
unsent         174

# Behind every occurrence of what the reader was told to find — in the body and
# in the header block alike, in the one message a search landed on. A fill rather
# than a foreground: it has to be seen at a glance from anywhere in a long
# message, where a text color would be competing with the quotes, the links and
# whatever the message's own BBS codes asked for. What is written on it is
# "background" above, so one number is the whole of it.
found          253

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. The frame around a label
# takes it too, so the whole button is what
# lights up. White, so that a tenth of a second is long enough to see it.
animated_button_text 231
