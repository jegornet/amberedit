# GoldED Classic — the sixteen colors of DOS text mode, the way FTN readers
# looked back in the 90s.
#
# The comments say what each role paints; themes/default.cfg carries the
# same list, and explains the numbering. Every key is optional, and one left out
# keeps its built-in color.
#
# This theme uses nothing above 15, so it is the sixteen colors your terminal
# already draws with — which is what it is for, and what makes it the one to
# reach for on a console that has no more than those.

# Painted across the whole screen. Black, as a text mode was.
background     0

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. The
# blue bar with white on it is the look this theme is named for.
selection      4
selection_text 15

# Behind a field that is typed into — the header of a message being written.
# The same blue the selection bar uses: sixteen colors do not stretch to a
# third fill, and the field the typing is in is told apart by the brighter
# text on it rather than by the color under it.
input_field    4

# The reader's header block: the From/To/Subj labels and their values.
header         7

# The top line of every screen — the lists' column headings and the title over
# a message being read — and the buttons of the context menu, which frame it the
# same way. The buttons have to stand clear of "dimmed" below, which is what one
# that cannot be pressed is drawn in.
table_header   7
menu_button    7

# A From or To naming you — the `name` from the AmberEdit config.
own_name       15

# A message in the message list nobody has read yet, across the row. Green on
# black, which is what a DOS reader marked one with, and clear of every other
# color this theme puts in that table. A From or To naming you keeps "own_name"
# above; the rest of the row still says the message is unread.
msglist_unread 2

# The message text, and a link inside it. Only the address takes the link
# color; the rest of the line keeps whatever it had.
text           7
link           12

# Quoted text by nesting depth, alternating so that several rounds of reply
# stay apart. Yellow quotes are GoldED's signature.
quote_odd      11
quote_even     15

# Service text, quiet by design:
#   kludge  ^A control lines in the message body (k shows them)
#   footer  the back button in the top-left corner and the menu button in the
#           top-right one
#   dimmed  what is on the screen but is not the user's own: an area the area
#           list cannot open, a menu button whose command is not available on
#           the message in front of you, and the stand-in
#           arealist_description_default puts where an area describes itself
#           with nothing
kludge         8
footer         8
dimmed         8

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. Dark grey in both themes: the
# row is there to be read past. What is left of the row beside the hints is a
# rule, drawn in "separator" like every other rule.
hint_bar       8

# The tearline and origin closing a message.
trailer        15

# Drawn rather than written: the rules between blocks, and the scrollbar —
# the track it runs in and the moving thumb.
separator      4
scroll_track   8
scroll_thumb   7

# Something to see to rather than to read:
#   error    a screen that could not be drawn — a base that cannot be read
#            while the user is looking at it
#   unsent   a message written here that has not gone out yet, across the
#            From/To/Subject of its row in the message list
error          9
unsent         9

# Behind every occurrence of what the reader was told to find. Bright white, the
# brightest fill these sixteen colors have, with the theme's black "background"
# written on it — which is how a DOS editor marked a search hit.
found          15

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. Bright white, the brightest thing a DOS
# text mode had.
animated_button_text 15
