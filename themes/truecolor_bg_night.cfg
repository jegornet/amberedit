# Belgrade Night — a dark truecolor theme inspired by evenings where the Sava
# meets the Danube.
#
# Every value here is a color and not a palette number: six hex digits, as
# 1c1e2a, where a palette number is one to three decimal ones. Nothing marks
# either — the two lengths cannot be read for one another, and a '#' means what
# it means in every file AmberEdit reads, which is that a comment starts here.
#
# Painted across the whole screen rather than left to show through: every color
# below was chosen against it, and on a light terminal the quiet blue-greys
# would be unreadable.
background     12141f

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. The
# fill is what says which row; the text on it is a light grey a step over the
# message's own, so that a row being acted on reads as the same row lifted
# rather than as a row in another color. Short of the near-white "dialog_title"
# and "focused_text", which are the brightest this theme goes.
selection      3d5a80
selection_text e8ebf1

# Whether what wears that fill is drawn bold along with it. Off, the bar keeping
# its two colors and nothing else; on adds the weight, saying what the fill says
# a second time.
selection_bold off

# Behind the message the reader's sidebar marks — a second selection fill,
# because the panel marks rather than chooses: the message is the one on the
# screen beside it, and the keyboard is in the reader. A step off the
# background, and toward the blue rather than away from it: the eye passes over
# it on the way to the message, and it never claims the attention the
# "selection" above has. What is written on it is "selection_text".
reader_sidebar_msglist_selected 2a3346

# Behind a field that is typed into but is not the one being typed into now —
# the header of a message being written — and what is written on that fill. One
# step above the screen is all the box takes to read as one that accepts typing,
# and the text on it is a shade under the message's own: a field standing idle
# is part of the header rather than a thing to look at.
input_field    242736
input_text     c2c8d6

# The field the typing is actually in, and the text on it. A fill lifted well
# clear of the idle fields, with near-white on it — that step is the whole of
# what marks the one the typing goes to. The attributes button beside the fields
# takes these too.
focused_field  4a5470
focused_text   f4f6fa

# The underscores standing in the columns of a field nothing has been typed into
# yet — the room it still has, said the way a paper form says it. A step above
# the fill of an idle field and below the fill of the one being typed into, so
# they are read where they are looked for and are not a second mark on a field
# the eye is already on.
input_filler   333748

# Drawn: the fills here are steps of the same near-black blue, and the
# underscores are what says a field is a field before anything is typed into it.
input_filler_show on

# A modal box has a palette of its own, the nine keys here: it carries a fill of
# its own rather than the screen's, so what is legible on the screen need not be
# legible on it. This theme keeps its boxes dark, as the screen is — a lit window
# over a screen this dark would be the brightest thing on it, and a dialog is
# meant to be read and dismissed rather than stared at.
#
# Behind the box, from its frame to the far corner: the same step above the
# screen an idle field takes, which is what says the box is laid over the screen
# rather than cut out of it.
dialog_background 242736

# What the box says, and every cell it puts no color of its own on. A shade
# under the "text" the screen is written in: the box is nearer the eye and needs
# no more than that.
dialog_text    cdd2de

# The label in the top rule. The brightest thing in the box, so that it says
# what the box is for at a glance; the rule either side of it stays the frame's.
dialog_title   f4f6fa

# A label inside the box, against the value it names. The same blue the reader's
# header block is written in — a label is not the value beside it, and a hue is
# what says so where both are light on dark.
dialog_label   6fa8dc

# Its quiet things: the keys along the bottom rule, an area it will not open, a
# menu button whose command is not available, and the underscores in a field the
# box is waiting to be typed into. A step above the kludge grey: on the window it
# is plainly under "dialog_text", and on the lighter "dialog_field" below it is
# what the underscores are drawn in.
dialog_hint    8189a0

# Behind a field in the box that is not being typed into now — the slot cut into
# the window. Its own role rather than the "input_field" the compose screen
# uses: that one is chosen against the screen, and a fill that stands off the
# screen need not stand off a window a step above it.
dialog_field   333748

# What a button says while a click on it is being shown. The amber this theme
# marks with, and pointedly not another light grey: a click lands on the selected
# button as readily as on the other one, and a flash a shade off what the button
# already wears would be no flash at all. It has to be seen both on the window
# and on the blue of "selection", and the accent is what is seen on both.
dialog_flash   f4f6fa

# The frame round the box — its sides, the rules closing it top and bottom, and
# the dividers between its blocks. A step above the "separator" the screen's own
# rules take: the frame stands on the window's fill and that fill is a step above
# the screen, so the line has to rise with it to be seen at all. Only the labels
# standing in the rules are lit.
dialog_border  6c7488

# The shadow the box casts on the screen behind it — two columns to the right of
# it and one row below, wiped to this color so that what it covers does not read
# as text in the dark. A step below the background rather than black: on a
# screen this dark a shadow is a step down and not a hole.
dialog_shadow  14161f

# The reader's header block: the From/To/Subj labels and their values alike. The
# one structural hue on the screen — the block says who wrote what to whom, and a
# color of its own tells it from the message under it without going brighter
# than the message is.
header         6fa8dc

# A From or To naming you — the `name` from the AmberEdit config. The theme's
# blue carried up near white: light enough to be picked out of a row at a
# glance, and a hue rather than another step of grey, so that it is told from
# the message text beside it and from the green of an unread row.
own_name       c3dcf5

# A message in the message list nobody has read yet, across the row. Green,
# lifted a little clear of the quote color so that it is its own mark in that
# table. A From or To naming you keeps "own_name" above; the rest of the row
# still says the message is unread.
msglist_unread 8cc894

# The message text, and a link inside it. Off-white for the text, and a muted
# ochre for the link — lighter than the tearline and the origin below, quiet
# enough not to break a paragraph up. Only the address takes the link color; the
# rest of the line keeps whatever it had.
text           d8dbe4
link           b0a188

# Quoted text by nesting depth. Two steps of one warm yellow, a light gold over
# a deeper amber: the interface alternates between them rather than going on
# down a ramp, so two are the whole of what a thread of any depth needs, and
# depth is what tells them apart. Both stand off the flat ochre a link takes,
# which is the one other warm thing inside a message.
quote_even     e0c47c
quote_odd      c9a45c

# Service text, quiet by design:
#   kludge  ^A control lines in the message body (k shows them)
#   screen_buttons
#           the quiet buttons drawn on the screen itself: the back button in the
#           top-left corner, the menu button in the top-right one, and the
#           delete-line button beside the row the cursor is on in the editor
#   dimmed  what is on the screen but is not the user's own: an area the area
#           list cannot open, a menu button whose command is not available on
#           the message in front of you, and the stand-in
#           arealist_description_default puts where an area describes itself
#           with nothing
kludge         7a8296
screen_buttons 7a8296
dimmed         7a8296

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. A cool grey a step over the
# kludges: the row is there to be read past. What is left of the row beside the
# hints is a rule, drawn in "separator" like every other rule.
hint_bar       6a707f

# The tearline and origin closing a message. Over the kludges and under the
# message: the lines are the sender's and not the program's, and still not what
# the message says.
trailer        8f8779

# The top line of every screen — the lists' column headings and the title over
# a message being read. The header's blue a step brighter: the line names what
# is under it instead of being part of it, and the same hue lifted says so
# without another color. A box's own top line is "dialog_title" above.
table_header   8fc0e8

# The buttons of the context menu. They stand inside a box, so this is a color
# on "dialog_background" and not on the screen: the window's own text color,
# clear of the "dialog_hint" a button that cannot be pressed is drawn in.
menu_button    cdd2de

# Drawn rather than written: the rules a screen sets its blocks apart with, and
# the scrollbar — the track it runs in and the moving thumb. Between the fills
# and the kludge grey, so the rules are seen without being read; the thumb rises
# off the track it moves in. A box's own frame is "dialog_border" above.
separator      4e5670
scroll_track   4e5670
scroll_thumb   6c7488

# Something to see to rather than to read:
#   error    a screen that could not be drawn — a base that cannot be read
#            while the user is looking at it
#   unsent   a message written here that has not gone out yet, across the
#            From/To/Subject of its row in the message list
# A muted red and, under it, the theme's amber: the second is a state the user
# put the message in rather than something that went wrong, and a warm mark
# clear of the red says "still to go" without reading as an alarm. Nothing else
# in that table is warm, so the row is found without being looked for.
error          d17b7b
unsent         f0a868

# Behind every occurrence of what the reader was told to find, and the color
# written on that fill. The blue "selection" carries, so that a hit reads as the
# same mark the lists put under whatever Enter would act on; the reader draws no
# selection bar of its own, so there is nothing on that screen for it to be
# mistaken for. The text is the near-white that bar carries too: a fill this
# near the screen's own color is read through a light run on it rather than a
# dark one. The interface draws the run bold as well.
found          3d5a80
found_text     e8ebf1

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. Near-white, the brightest thing here: it
# is on screen for a tenth of a second and has to be seen in that time.
animated_button_text f4f6fa
