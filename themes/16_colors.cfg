# 16 colors — the sixteen of DOS text mode, the way FTN readers looked back in
# the 90s.
#
# The comments say what each role paints; themes/black.cfg is the built-in
# palette written out and explains the numbering. Every key is optional, and one
# left out keeps its built-in color.
#
# This theme uses nothing above 15, so it is the sixteen colors your terminal
# already draws with — which is what it is for, and what makes it the one to
# reach for on a console that has no more than those.

# Painted across the whole screen. Black, as a text mode was.
background     0

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. The
# blue bar with white on it is what a reader of that era marked a row with.
selection      4
selection_text 15

# Behind a field that is typed into but is not the one being typed into now —
# the header of a message being written — and what is written on that fill. The
# screen's own black with light grey on it: an idle field carries no fill of its
# own here, and what says it is a field is the underscores below standing in the
# room it has left.
input_field    0
input_text     7

# The field the typing is actually in, and the text on it. Dark grey with bright
# white on it — a fill where the idle fields have none, which is what marks the
# one the typing goes to. The attributes button beside the fields takes these
# too.
focused_field  8
focused_text   15

# The underscores standing in the columns of a field nothing has been typed into
# yet — the room it still has, said the way a paper form says it. Dark grey on
# the black of an idle field, where they are the whole of what says a field is
# there; on the field being typed into they go under its own dark grey, that
# fill saying the same thing already.
input_filler   8

# Drawn, in this theme: with no fill under an idle field there would otherwise be
# nothing to see there at all.
input_filler_show on

# A modal box has a palette of its own, the nine keys here, and this is the theme
# that needs it: the box is a light grey window with black in it — what a DOS
# program opened over what you were doing — where the screen behind it is light
# on black. The same role could not serve both.
dialog_background 7
dialog_text    0

# The label in the top rule. Dark red rather than the black of the text or the
# blue of the rule it stands in, so that the box says what it is for at a
# glance; the rule either side of it stays the frame's.
dialog_title   1

# A label inside the box, against the value it names. Blue on grey, the way a
# field was labelled on a screen like this.
dialog_label   4

# Its quiet things: the keys along the bottom rule, an area it will not open, a
# menu button whose command is not available. Dark grey on light grey, which is
# what a DOS window drew a dead item in.
dialog_hint    8

# Behind a field in the box that is not being typed into now. White, with the
# blue of "dialog_label" in it — the slot cut into a grey window. It cannot be
# the "input_field" the compose screen uses: that one is the screen's own black,
# which in a grey window would read as a hole rather than as a field.
dialog_field   15

# What a button says while a click on it is being shown. Red, because it has to
# be seen both on the grey above and on the blue of "selection": white would be
# right on the blue bar and all but invisible on the grey.
dialog_flash   9

# The frame round the box — its sides, the rules closing it top and bottom, and
# the dividers between its blocks. The same blue the screen's rules take in
# "separator" below: on the grey window it is the line a DOS program drew its
# windows with. Only the labels standing in the rules are lit.
dialog_border  4

# The shadow the box casts on the screen behind it — two columns to the right of
# it and one row below. Black, which is what a DOS window's shadow amounted to:
# nothing at all over an empty screen, and the text it falls across put out.
dialog_shadow  0

# The reader's header block: the From/To/Subj labels and their values.
header         7

# The top line of every screen — the lists' column headings and the title over
# a message being read. Dark yellow on the black screen — clear of the light grey
# the rows under it are written in, so the line naming the columns is not read as
# one of them; a box's own top line is "dialog_title" above.
table_header   3

# The buttons of the context menu. They stand inside a box, so this is a color
# on "dialog_background" and not on the screen: black on the grey window, clear
# of the "dialog_hint" a button that cannot be pressed is drawn in.
menu_button    0

# A From or To naming you — the `name` from the AmberEdit config.
own_name       15

# A message in the message list nobody has read yet, across the row. Green on
# black, which is what a DOS reader marked one with, and clear of every other
# color this theme puts in that table. A From or To naming you keeps "own_name"
# above; the rest of the row still says the message is unread.
msglist_unread 2

# The message text, and a link inside it. Only the address takes the link
# color; the rest of the line keeps whatever it had.
text           7
link           12

# Quoted text by nesting depth, alternating so that several rounds of reply
# stay apart. Yellow is what the readers of that era quoted in.
quote_odd      11
quote_even     15

# Service text, quiet by design:
#   kludge  ^A control lines in the message body (k shows them)
#   screen_buttons
#           the quiet buttons drawn on the screen itself: the back button in the
#           top-left corner, the menu button in the top-right one, and the
#           delete-line button beside the row the cursor is on in the editor
#   dimmed  what is on the screen but is not the user's own: an area the area
#           list cannot open, a menu button whose command is not available on
#           the message in front of you, and the stand-in
#           arealist_description_default puts where an area describes itself
#           with nothing
kludge         8
screen_buttons 8
dimmed         8

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. Dark grey: the row is there to
# be read past. What is left of the row beside the hints is a rule, drawn in
# "separator" like every other rule.
hint_bar       8

# The tearline and origin closing a message.
trailer        15

# Drawn rather than written: the rules a screen sets its blocks apart with, and
# the scrollbar — the track it runs in and the moving thumb. A box's own frame is
# "dialog_border" above.
separator      4
scroll_track   8
scroll_thumb   7

# Something to see to rather than to read:
#   error    a screen that could not be drawn — a base that cannot be read
#            while the user is looking at it
#   unsent   a message written here that has not gone out yet, across the
#            From/To/Subject of its row in the message list
error          9
unsent         9

# Behind every occurrence of what the reader was told to find. Bright white, the
# brightest fill these sixteen colors have, with the theme's black "background"
# written on it — which is how a DOS editor marked a search hit.
found          15

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. Bright white, the brightest thing a DOS
# text mode had.
animated_button_text 15
