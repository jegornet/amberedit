# Black — the palette AmberEdit uses when no theme is named in its config,
# written out in full so that it can be copied and edited. Every key is
# optional, and one left out keeps its built-in color, so a theme of your own
# may be a single line.
#
# The comments say what each role paints. Several roles share a color here;
# they are separate keys precisely so that a theme can take them apart.
#
# Nothing here is an entry below 16. Those sixteen are whatever the terminal was
# configured to draw them as, and a palette written in them changes with the
# profile it is looked at through; every color below is one the 256-color palette
# fixes, so the program looks the same wherever it is opened.
#
# Every value is a number from 0 to 255 — an entry in the terminal's own
# 256-color palette, the same numbering `ESC[38;5;Nm` uses:
#
#     0-7     the ANSI colors, as your terminal draws them
#     8-15    their bright halves
#     16-231  a 6x6x6 cube: 16 + 36*r + 6*g + b, each of r, g and b being 0-5
#     232-255 a ramp of 24 greys, black to white

# Painted across the whole screen.
background     232

# Behind whatever Enter would act on — the current row of either list, the
# selected button of the quit dialog — and the text written on that fill. The
# one color on this screen that is not a grey: a row being acted on is the thing
# the eye has to find first.
selection      25
selection_text 231

# Behind a field that is typed into but is not the one being typed into now —
# the header of a message being written — and what is written on that fill. One
# step off the screen's own black, with light grey on it: enough to read as a box
# that takes typing on a screen this dark, and no more than that.
input_field    234
input_text     251

# The field the typing is actually in, and the text on it. Dark grey with white
# on it — a lighter fill than the idle fields carry, which is what marks out the
# one the typing goes to. The attributes button beside the fields takes these
# too.
focused_field  241
focused_text   231

# The underscores standing in the columns of a field nothing has been typed into
# yet — the room it still has, said the way a paper form says it. A step above
# the fill of an idle field and below the fill of the one being typed into, so
# they are read where they are looked for and are not a second mark on a field
# the eye is already on.
input_filler   237

# Drawn, in this theme: the fills here are steps of near-black, and the
# underscores are what says a field is a field before anything is typed into it.
input_filler_show on

# A modal box has a palette of its own, the nine keys here: it carries a fill of
# its own rather than the screen's, so what is legible on the screen need not be
# legible on it. This theme keeps its boxes dark, as the screen is — a lit window
# over a black screen would be the brightest thing on it, and a dialog is meant
# to be read and dismissed rather than stared at.
#
# Behind the box, from its frame to the far corner. A step above the screen's own
# black rather than that black again: a dialog reads as something laid over the
# screen, and this step is what says so.
dialog_background 234
# What the box says, and every cell it puts no color of its own on. Light grey,
# a shade under the "text" the screen is written in: the box is nearer the eye
# and needs no more than that.
dialog_text    252

# The label in the top rule. The brightest thing in the box — over the light grey
# of its text and well over the grey of the rule it stands in — so that the box
# says what it is for at a glance; the rule either side of it stays the frame's.
dialog_title   255

# A label inside the box, against the value it names. Light blue on the dark
# window — a label is not the value beside it, and a hue is what says so where
# both are light on dark.
dialog_label   111

# Its quiet things: the keys along the bottom rule, an area it will not open, a
# menu button whose command is not available, and the underscores in a field the
# box is waiting to be typed into. Mid grey: on the window it is a step under
# "dialog_text" and still plainly there, and on the lighter "dialog_field" below
# it is what the underscores are drawn in.
dialog_hint    244

# Behind a field in the box that is not being typed into now — a step lighter
# again than the window, the slot cut into it. Its own role rather than the
# "input_field" the compose screen uses: that one is chosen against the screen's
# black, and a fill that stands off black need not stand off a window a step
# above it.
dialog_field   237

# What a button says while a click on it is being shown. White: it has to be seen
# against the window and against the blue "selection" a chosen button wears,
# since a click lands as readily on the one as on the other.
dialog_flash   231

# The frame round the box — its sides, the rules closing it top and bottom, and
# the dividers between its blocks. A step above the "separator" the screen's own
# rules take: the frame stands on the window's fill and that fill is a step above
# the screen, so the line has to rise with it to be seen at all. Only the labels
# standing in the rules are lit.
dialog_border  240

# The shadow the box casts on the screen behind it — two columns to the right of
# it and one row below, wiped to this color so that what it covers does not read
# as text in the dark. Black: on a screen this near black there is nothing else
# left to darken to, and that is the whole of what a shadow can be here.
dialog_shadow  16

# The reader's header block: the From/To/Subj labels and their values. A step
# under the "text" below it: the block says who wrote what to whom, and the
# message is the thing being read.
header         252

# The top line of every screen — the lists' column headings and the title over
# a message being read. A light blue rather than another grey: the line names
# what is under it instead of being part of it, and a hue nothing else on this
# screen carries says so without going brighter than the message text. A box's
# own top line is "dialog_title" above, which has no room for a hue and is told
# apart by being the brightest grey here instead.
table_header   110

# The buttons of the context menu. They stand inside a box, so this is a color
# on "dialog_background" and not on the screen: light grey on the dark window,
# clear of the "dialog_hint" a button that cannot be pressed is drawn in.
menu_button    252

# A From or To naming you — the `name` from the AmberEdit config.
own_name       231

# A message in the message list nobody has read yet, across the row. Green on
# black, which is what a DOS reader marked one with, and clear of every other
# color this theme puts in that table. A From or To naming you keeps "own_name"
# above; the rest of the row still says the message is unread.
msglist_unread 40

# The message text, and a link inside it. Only the address takes the link
# color; the rest of the line keeps whatever it had.
text           254
link           33

# Quoted text by nesting depth, alternating so that several rounds of reply
# stay apart. Light yellow and cream: a hue nothing else here uses, so that
# quoted text is told from the message around it at a glance, and two steps of
# it near enough that a deep thread does not turn into a color chart.
quote_odd      228
quote_even     231

# Service text, quiet by design:
#   kludge  ^A control lines in the message body (k shows them)
#   screen_buttons
#           the quiet buttons drawn on the screen itself: the back button in the
#           top-left corner, the menu button in the top-right one, and the
#           delete-line button beside the row the cursor is on in the editor
#   dimmed  what is on the screen but is not the user's own: an area the area
#           list cannot open, a menu button whose command is not available on
#           the message in front of you, and the stand-in
#           arealist_description_default puts where an area describes itself
#           with nothing
kludge         242
screen_buttons 244
dimmed         244

# The hint bar along the last row of the screen — the commands of whichever
# screen is up, each behind the key that runs it. Mid grey: the row is there to
# be read past. What is left of the row beside the hints is a rule, drawn in
# "separator" like every other rule.
hint_bar       244

# The tearline and origin closing a message.
trailer        249

# Drawn rather than written: the rules a screen sets its blocks apart with, and
# the scrollbar — the track it runs in and the moving thumb. A box's own frame is
# "dialog_border" above.
separator      239
scroll_track   239
scroll_thumb   241

# Something to see to rather than to read:
#   error    a screen that could not be drawn — a base that cannot be read
#            while the user is looking at it
#   unsent   a message written here that has not gone out yet, across the
#            From/To/Subject of its row in the message list
error          196
unsent         210

# Behind every occurrence of what the reader was told to find. White, the
# brightest fill there is, with the theme's black "background" written on it —
# which is how a DOS editor marked a search hit.
found          231

# What a button says while a click on it is being shown — the back button's
# arrow, the confirmation's Yes and No, a thread marker beside the message
# number, a button of the context menu. White, the brightest thing there is: it
# is on screen for a tenth of a second and has to be seen in that time.
animated_button_text 231
